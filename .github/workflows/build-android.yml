name: Talogram Android (signed APK)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: talogram-android
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/27.2.12479018
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK, NDK and accept licenses
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmdtools.zip
          cd /tmp
          unzip -q cmdtools.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "build-tools;36.0.0" "platforms;android-36" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"
          test -d "$ANDROID_NDK_HOME"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Talogram (afat release)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Talogram-Android-${{ github.run_number }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          compression-level: 0
